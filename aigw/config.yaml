# aigw — 这台机器上的额度网关配置（产品起的就是这一份）
#
# 这里**故意不放 mock**。裁定 46 说额度清单只有一份真源、来自网关；R-017 说 mock
# 模型不许进选择框。上一版这份配置用 `routing.rules: match "*"` 把任何模型都改写成
# `mock/echo`，于是：网关活着 ≠ 有任何能用的渠道，而 doctor 还会把这种状态报成绿
# （mock 自己也挂着 `workbuddy/deepseek-chat` 这个 id，见 commit c7bae4a9 之前）。
# 没有适配的软件就不显示——宁可目录为空，也不要一条假的"成功"。
#
# 模型名单不在这里手抄。`workbuddy` hybrid provider 在启动时经
# `Registry.ensure_models_refreshed()` → `WorkbuddyHybridProvider.refresh_models`
# → `CliProvider.refresh_models` 从 CLI 自己的声明里拿（这台实测 17 条，
# 含 hy4-preview / glm-5.3 / kimi-k3-1 等配置里写不出来的 id）。
# 所以本文件只留：端口、这把本地钥匙、走哪条路线、并发口径。
#
# 路线与合规性（2026-10-07 实查）：
# - 只装得上、又只在这台跑着、且带 headless 入口的桌面额度软件是 WorkBuddy。
#   它自带终端 CLI（`D:\Software\WorkBuddy\resources\app.asar.unpacked\cli\bin\codebuddy`）。
#   spawn 自己的 CLI = 吃自己的订阅，不扒 token、不逆向协议。
# - Cursor 装了但 `%APPDATA%\Cursor` 不存在（没会话），且这个版本没有 CLI 实体；
#   Marvis 装了在跑，但 UIA 从服务上下文看不见它的窗口；Antigravity 没装，
#   且 `config.antigravity-desktop.yaml` 自己写着 `agy` 那个 CLI 并不存在。
# - WorkBuddy 与 CodeBuddy 同一账号积分共享（两家定价页各写了一遍），所以吃的
#   确实是你桌面订阅那份，不是另开的一笔钱。
# - 已知限制：CodeBuddy 的凭据是**机器级**的——空的 CODEBUDDY_CONFIG_DIR 照样已
#   登录。所以"另拿一个隔离账号专门跑聚合"目前做不到，厂商不改行为就不行。
#
# `--tools ""` 是刻意的：关掉工具集，一条网关请求才是"一次文本补全"，而不是一个
# 会读写这台机器文件的完整编码 agent。`gui:` 段整段不写 = 禁用 UI 自动化兜底，
# 所以这条通道永远不会去抢你的屏幕。
#
# 钥匙保持 `sk-local-dev-key`，与 Plobi 侧的默认值（plobi/agents/registry.py
# `aigw_api_key()` 的兜底）一致——这样产品开箱就能连上自己起的网关，不需要谁再
# 往环境里钉一遍。端口同理保持 8000：绑端口的是这份文件，别处只该引用它。

server:
  host: 127.0.0.1
  port: 8000
  api_key: sk-local-dev-key

logging:
  level: INFO

# CLI 要出网到 www.workbuddy.cn；这台有 TLS 拦截代理，所以照 Cursor 那份一样认系统代理。
trust_env: true

vault:
  enabled: false          # spawn-CLI 路线不落任何 token，没有需要加密落盘的东西

scheduler:
  max_retries: 2
  global_concurrency: 4
  per_account_concurrency: 1     # 一次一个子进程，一个 CLI 会话不便宜
  sticky_ttl: 1800
  strategy: least_fail

routing:
  # 不再有 match "*"。`workbuddy/<模型>` 由 registry 的"provider/任意名"规则直接命中；
  # 认不出的名字应当报错，不该被通配悄悄改写成别的东西。
  rules: []

providers:
  workbuddy:
    enabled: true
    prefer: cli
    # 不写 models：名单由 CLI 自己声明（见文件头）。
    cli:
      interpreter: D:\Runtimes\Languages\Node\node.exe
      # 独立版 CodeBuddy CLI，不是 WorkBuddy 内嵌那一份。两者广告 different 模型集
      # ——内嵌版说 glm-5.0 / kimi-k2.5，独立版 2.161.4 说 glm-5.3 / kimi-k3-1 /
      # deepseek-v4-pro——而目录由 `--help` 现读，指错一份就等于拿错名单。
      binary: D:\Portables\cli\CodeBuddy\node_modules\@tencent-ai\codebuddy-code\bin\codebuddy
      prompt_flag: -p                 # 布尔 --print，提示词按位置参数跟着走
      model_flag: --model
      extra_args:
        - --output-format
        - text
        - --tools
        - ""
      timeout: 180
      cwd: D:\Temp
    accounts:
      - { id: workbuddy-cli }

  # 桌面订阅那条腿（agy / Google）。10-12 20:3x **打开**：用户拍的目标是
  # 「整个系统不靠按 token 的 API 也能工作」，而实测只有这条腿带得动工具——
  # `workbuddy` 那条腿是 `--tools ""` 的纯文本档（`capabilities.tools=false`），主循环一发就 400：
  #   HTTP 400: model 'workbuddy/hy3' route does not support tools/tool_calls
  #   (provider capabilities.tools=false). Pick a tools-capable model or drop the tools field.
  # 硬限制照旧：拿不到那对 OAuth client 参数 ⇒ **不能自己续期**，只能用 agy 续出来、写回本机存储的那枚
  # access token（这台实测约 60 分钟寿命；`ensure_fresh` 每次派发前重读存储接住续期，
  # `plobi doctor` 的 `subscription_desktop_store` 一行会说还剩几分钟，过期就报「打开 agy 跑一次」）。
  # 关掉它：把 enabled 改回 false 并重启网关（providers 在启动时建，见 `aigw/aigw/registry.py`）。
  # 不写 models：名单由上游 `fetchAvailableModels` 现读（这台实测 20 条）。
  # ⚠️ 别拿目录第一项当默认——顺序不稳，`antigravity/gemini-pro-agent` 这类条目对
  #    generateContent+tools 回 `Request contains an invalid argument`。
  antigravity:
    enabled: true
    host: https://daily-cloudcode-pa.googleapis.com
    api_version: v1internal
    # 不写 refresh_token：这条腿的凭据来自桌面应用自己维护的本机存储
    # （Windows: Credential Manager `gemini:antigravity`；macOS: Keychain）。
    # 存储里有活的就用、没有就报「打开 agy 登一次」，不需要任何人粘环境变量。
    accounts:
      - { id: desktop-store }

  # CodeBuddy 订阅的 HTTP 口：`POST /v2/chat/completions`，OpenAI 形状，**带工具**。
  # 2026-10-11 那把桥接的是 agy（Google）；这条是用户 10-12 拍的第二条订阅口——
  # 它比 agy 那条好用在一处：本地那张 auth 记录里 access 约 28 天、refresh 约 30 天，
  # 且**我们能自己拿 refresh 去续**（agy 那条不行，只能等桌面 app 跑一次）。
  # 实测（同一天）：`stream:true` ⇒ `finish_reason=tool_calls`、usage 196/52/248；
  # `stream:false` ⇒ `400 {"code":11101,"msg":"Non-stream chat request is currently not supported"}`
  # ——一个 400 而不是 401，同时也证明 bearer 是过了认证的。
  # 因此 `providers/workbuddy.py::chat()` 现在永远走 SSE 再把增量折回一条 completion。
  # 凭据不落盘、不进日志、不进 .env：`token_source` 只在运行时从桌面 app 自己的记录里读，
  # 续期出来的新 token 也只留在内存（那张文件归桌面 app，我们不当第二个写的人）。
  # 只列**实测过的那一个**模型 id：厂商目录口没验过，宁可名单短，也不放一条点了必失败的名字。
  workbuddy_api:
    enabled: true
    base_url: https://www.workbuddy.cn
    dialect: openai
    chat_path: /v2/chat/completions
    token_source: codebuddy_desktop_store
    header_templates:
      - { name: "X-Agent-Intent", value: "craft" }
      - { name: "X-Auth-Refresh-Source", value: "plugin" }
    # 目录 = CodeBuddy 那张 CLI 目录的同一批模型名，逐条在 10-13 19:3x–19:5x 用真流量探过
    # （`stream:false` 走本腿的内部聚合）：**18 条全部可达，其中 16 条当场回了 tool_calls**；
    # `glm-5.1` 与 `kimi-k2.8-preview` 回了 stop 且没调工具（模型行为，不是通道不行），
    # 仍然列着——能不能带工具由 `capabilities.tools` 说，不由我们挑。
    # ⚠️ 这是一份**抄本**，厂商加模型时不会自己长出来：重探的方法与判据见
    # `Docs/PROGRESS.md` 10-13 那行；正解是让这条腿自己去取活目录（下一个格子），
    # 但在那之前，少一条就是选择框里少一条能用的模型——用户 10-13 19:4x 就是为这个骂的。
    models:
      - workbuddy_api/hy3
      - workbuddy_api/hy3-x
      - workbuddy_api/hy4-preview
      - workbuddy_api/glm-5.1
      - workbuddy_api/glm-5.2
      - workbuddy_api/glm-5.3
      - workbuddy_api/glm-5.3-flash
      - workbuddy_api/glm-5v-turbo
      - workbuddy_api/kimi-k2.6
      - workbuddy_api/kimi-k2.7
      - workbuddy_api/kimi-k2.8-preview
      - workbuddy_api/kimi-k3-1
      - workbuddy_api/deepseek-v4-pro
      - workbuddy_api/deepseek-v4.1-flash
      - workbuddy_api/minimax-m2.7
      - workbuddy_api/minimax-m3
      - workbuddy_api/step-5-preview
      - workbuddy_api/space-bunny
    accounts:
      - { id: desktop }
