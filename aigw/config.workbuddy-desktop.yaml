# aigw — Workbuddy gateway config — DESKTOP (hybrid CLI/GUI route)
#
# Uses the `workbuddy` hybrid provider: prefers the locally-installed `workbuddy`
# CLI (spawn-based, opendesign-style — no token scraping), and falls back to
# Windows UI Automation of the Workbuddy Desktop app when no CLI is present.
# No OAuth / API key is required: it rides on the user's already-logged-in
# Workbuddy (CLI or Desktop). The desktop's plobi-gateway:auth handler detects
# a local Workbuddy and starts this gateway on port 8020.
#
# This mirrors config.antigravity-desktop.yaml but uses the compliant
# `workbuddy` provider instead of the token-based `antigravity` provider.

server:
  host: 127.0.0.1
  port: 8020
  api_key: ${AIGW_KEY:-sk-local-workbuddy}

logging:
  level: INFO

providers:
  # Hybrid Workbuddy provider: prefer CLI, fall back to GUI.
  # `models` is the seed catalog surfaced in /v1/models. Replace these with the
  # real model ids your Workbuddy build exposes (the hybrid provider serves them
  # as-is — there is no upstream discovery step yet). If your `workbuddy` CLI
  # supports a model-listing subcommand, that can be wired into fetch_available_models later.
  workbuddy:
    enabled: true
    models:
      - workbuddy/default
      - claude-opus-4-6
      - claude-sonnet-4-6
      - gpt-5
      - gemini-3-flash
    # CLI route — spawn the local `workbuddy` binary (must be on PATH).
    # Auto-disables (0 accounts) if the binary is missing, so the GUI fallback
    # can take over safely.
    cli:
      binary: workbuddy
      prompt_flag: -p
      model_flag: --model
      timeout: 180
    # GUI route — Windows UI Automation of the Workbuddy Desktop chat box.
    # Leave this block OUT (or empty) to disable the GUI route. To enable, run
    # `aigw workbuddy-dump` on the target Windows machine and paste the captured
    # selectors here (see aigw/docs/GUI_AUTOMATION.md).
    # gui:
    #   window_title: Workbuddy

routing:
  rules: []
