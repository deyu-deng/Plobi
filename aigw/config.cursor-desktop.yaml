# aigw — Cursor gateway config — DESKTOP (agent.v1 AgentService/Run route)
#
# Uses the `cursor` provider, which reads the user's already-logged-in Cursor
# session from %APPDATA%\Cursor\User\globalStorage\state.vscdb (token + refresh)
# and storage.json (machine ids for the x-cursor-checksum header). No OAuth /
# sign-in is required: the desktop's plobi-gateway:auth handler detects a local
# Cursor and starts this gateway on port 8021.
#
# Chat travels over Cursor's current protocol (agent.v1.AgentService/Run) as
# Connect-JSON over HTTP/2 with the derived anti-abuse headers. See
# aigw/providers/cursor.py for the full request construction.

server:
  host: 127.0.0.1
  port: 8021
  api_key: ${AIGW_KEY:-sk-local-cursor}

# Honor the proxy the desktop injects (the aigw child gets HTTP(S)_PROXY from
# the system registry) so api2.cursor.sh is reachable from behind it.
trust_env: true

logging:
  level: INFO

providers:
  cursor:
    enabled: true
    use_local_session: true          # auto-read Cursor state.vscdb + storage.json
    # Current Cursor chat endpoint (HTTP/2 + Connect-JSON required).
    host: https://api2.cursor.sh
    chat_path: /agent.v1.AgentService/Run
    # connect_json = the documented AgentService/Run Connect-JSON route.
    # use_proto stays false (the protobuf stubs in cursor_proto.py are a skeleton).
    use_proto: false
    fallback: connect_json
    client_version: "2.6.20"        # x-cursor-client-version sent in headers
    # Map OpenAI model names -> Cursor model ids (slug prefix is stripped first).
    model_map: {}
    # Seed catalog surfaced in /v1/models (kept in sync with
    # CursorProvider.served_models). Real Cursor model ids: gpt-4o, claude-4-sonnet, auto.
    models:
      - cursor/gpt-4o
      - cursor/claude-4-sonnet
      - cursor/auto
    accounts: []

routing:
  rules: []
