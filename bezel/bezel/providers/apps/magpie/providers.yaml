# 我们给 magpie 的 provider 配的**化妆品** —— 不是清单。
#
# 这张表的语义在 2026-11-20 掉了个头（用户：「magpie 是腿源，不是一条腿」）：
#
#   * **集合由 magpie 决定。** 它报出哪一家，屏上就出现哪一张卡；它撤哪一家，
#     卡跟着消失。这里没有写到的 provider 不是「不上屏」，只是「名字用它的原话」。
#   * 本表只管**化妆品**：屏上读的名字、字幕指向哪个 i18n 键、我们怎么登它。
#   * 一家我们从没见过的新 provider 进来 ⇒ 照样出卡，标题用它的自报名，字幕走
#     通用兜底（`${name} 的订阅额度`，四语各有）。想让它读起来像我们的产品，
#     就在这里加一行 —— 加的是**措辞**，不是**准入**。
#
# 为什么曾经反过来（2026-11-09）：magpie 一天发好几版、单人主维护、外部 PR 关闭，
# 它的 `plugin list --json` 是内部形状，随时会改。所以那时我们说「名字、登录方式、
# 要不要出卡，都由我们说了算」，用一张全集表把它挡在外面。代价是它的目录一变，
# 我们的屏就落后一版 —— 它加一家 provider，用户看不到；它改了 id，两张卡互相遮。
#
# 现在分工更清楚：**它是腿源**（谁在、能不能用，它说），**我们是网关与门面**
# （模型怎么发、卡怎么长、字怎么翻，我们说）。id 一旦在用户机器上存过，就不许再变，
# 所以 `upstream` 那一格专门留给「它今天叫这个名字」。
#
# 一行一家：
#   `upstream`   发给他们时用的 id（= 左边我们的键；要改名时只改这一格）
#   `name`       屏上读的标题（产品名，四语不翻）
#   `intro_key`  字幕指向的四语键（缺省就是本行的键）
#   `login`      我们走哪条登录通道（oauth = 浏览器，api = 我们要一把 key）
#
# 下面这些是 2026-11-10 实测 magpie 自报过的 22 家。**这份清单不再是准入条件**：
# 它撤掉的 provider 不会因为留在这里而复活（`present` 由它说了算），它新加进来的
# 也不会因为不在这里而被藏起来。`check_magpie_providers.py` 列出的是「还没被措辞
# 覆盖的 provider」，那是一件文案活儿，不再是「没认领所以不给卡」。

providers:
  workbuddy:
    upstream: workbuddy
    name: WorkBuddy
    card: true
    login: oauth

  # 国际版：另一家厂商、另一张卡（用户 2026-11-09 20:3x：「国际版和国内版本来就是要
  # 分成两张卡片的」）。
  workbuddy-ai:
    upstream: workbuddy-ai
    name: WorkBuddy AI
    card: true
    login: oauth

  # 免费池：他们那边免个人 key（键填 public），所以它没有登录这一步。
  opencode-zen-free:
    upstream: opencode-zen-free
    name: OpenCode Zen Free
    # 字幕沿用现成的四语键：这是「免费额度」，不是 `opencode_api` 那张「API 额度」。
    intro_key: opencode_cli
    card: true
    login: api

  # ── Qoder 家族（他们一个插件签四个 provider）────────────────────────────────
  qoder:
    upstream: qoder
    name: Qoder
    card: true
    login: oauth

  qoder-cn:
    upstream: qoder-cn
    name: Qoder CN
    card: true
    login: oauth

  qwenwork:
    upstream: qwenwork
    name: QwenWork
    card: true
    login: oauth

  qwenwork-enterprise:
    upstream: qwenwork-enterprise
    # 他们自报的是「QwenWork 企业版」——那是中文。这一格**四语不翻**，原名直接把汉字
    # 送上日文与英文界面（用户 11-20 的红线：屏上不许有漏翻的中文）。产品名保持拉丁
    # 字母，中文那一层交给下面的 `intro_key`（它走 i18n，按界面语言给句子）。
    name: QwenWork Enterprise
    card: true
    login: oauth

  # ── 其余社区插件 ───────────────────────────────────────────────────────────
  kiro:
    upstream: kiro
    name: Kiro
    intro_key: kiro_cli
    card: true
    login: oauth

  cline:
    upstream: cline
    name: Cline
    intro_key: cline_cli
    card: true
    login: oauth

  github-copilot:
    upstream: github-copilot
    name: GitHub Copilot
    card: true
    login: oauth

  cursor:
    upstream: cursor
    name: Cursor
    card: true
    login: oauth

  # 它自报的就是 `antigravity`（2026-11-20 实测 `magpie plugin list --json`：8 家之一）。
  # 下面那条 `agy-cli` 是同一个产品的另一套叫法，留着兼容它换 id 的那天 —— 两条都指
  # 向同一句四语文案，所以无论它报哪个，屏上都是「Antigravity 的订阅额度」。
  antigravity:
    upstream: antigravity
    name: Antigravity
    intro_key: antigravity
    card: true
    login: oauth

  agy-cli:
    upstream: agy-cli
    name: Antigravity CLI
    intro_key: antigravity_cli
    card: true
    login: oauth

  # 2026-11-21 实测新冒出来的一家：`opencode-gemini-auth` 那次加载没挺过去时屏上没有它，
  # 插件起来之后它自己出现（37 个模型），我们一行代码没动 —— 这就是「集合归 magpie」。
  # 这里补一行措辞，否则标题会是它的自报名（能看，但读起来不像我们的产品）。
  google:
    upstream: google
    name: Google
    card: true
    login: oauth

  devin:
    upstream: devin
    name: Devin
    card: true
    login: oauth

  grok:
    upstream: grok
    name: Grok
    card: true
    login: oauth

  trae-cn:
    upstream: trae-cn
    name: Trae CN
    card: true
    login: oauth

  trae-global:
    upstream: trae-global
    name: Trae Global
    card: true
    login: oauth

  mimo-app:
    upstream: mimo-app
    name: Xiaomi MiMo
    card: true
    login: oauth

  minimax-code:
    upstream: minimax-code
    name: MiniMax Code
    card: true
    login: oauth

  minimax-code-global:
    upstream: minimax-code-global
    name: MiniMax Code (Global)
    card: true
    login: oauth

  joycode:
    upstream: joycode
    name: JoyCode
    card: true
    login: oauth

  tabbit:
    upstream: tabbit
    name: Tabbit
    card: true
    login: oauth

  zcode:
    upstream: zcode
    name: ZCode
    card: true
    login: oauth
