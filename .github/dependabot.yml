# 自动换号机器人。存在意义是让「钉死编号」的过期代价由机器承担，见
# AGENTS.md 的 Dependency Pinning Policy。
#
# github-actions 这一条会同时改写 `uses:` 里的 40 位编号和行尾的 `# vX.Y.Z` 注释，
# 所以注释必须留在同一行——注释丢了，机器人就认不出版本了。
#
# 噪音控制：上限是「每个生态各自计算」的，默认 5 个，当时 6 个生态就意味着最多 30 个
# PR 同时挂着（实测一次涌出 19 个）。所以每条都显式压到 3，并把 minor/patch
# 合并成单个 PR；跨大版本的升级保持一条一个 PR，留给人判断。
# 现在共 5 条（github-actions / pip / npm×3）。Python 不接机器人，原因见下方长注释。
#
# 已知盲点：SHA 钉死的 action 不会触发 Dependabot 安全告警（只有语义化版本写法才会）。
# 版本更新覆盖，安全告警不覆盖。补这一块的目前是 .github/workflows/action-pin-audit.yml。

version: 2
updates:
  # 覆盖 .github/workflows/ 下全部工作流，不需要逐个目录列
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(ci)"
    groups:
      ci_minor_patch:
        update-types: ["minor", "patch"]

  # Python 依赖不接机器人。原因经两轮实测确定，别再加重试、也别再试图用 ignore 修：
  #
  # 第一轮（无 ignore）：报 3 个 dependency_file_not_resolvable
  #   （daytona / microsoft-teams-apps / websockets，均在 python 3.13 解析分支上
  #    与项目里 aiohttp==3.14.1 / cryptography==46.0.7 / websockets==17.1 的精确钉死冲突）
  #   外加 3 个 dependency_file_content_not_changed（markdown / pillow / pyjwt[crypto]）。
  # 第二轮（把上面那 3 个名字 ignore 掉）：not_resolvable 全部消失——ignore 确实生效了——
  #   但任务**仍然 failure**，只剩 content_not_changed 那三个。
  # 而这三个包**根本不在 pyproject.toml 里**，是被带进来的间接依赖：PyPI 上确有新版
  #   （markdown 3.10.2→3.11、pillow 12.2.0→12.3.0、pyjwt 2.13.0→2.15.0），
  #   但在现有约束下解析不动，uv 产出"无变化"，而 Dependabot 把"无变化"计为错误。
  # 结论：本仓库刻意采用「精确钉死 + 上限」策略（见 AGENTS.md），"尝试后无变化"是常态，
  #   ignore 多少个名字都治不完，这条无法稳定转绿。
  # 它确实能产出 PR（PR #20 一次 44 项、#21、#22，连 uv.lock 都改对了），
  #   所以这不是"没用"，是"每轮必然报红"——留着就是又一处"看着有、实际不可信"的闸门。
  # Python 依赖按 AGENTS.md《Dependency Pinning Policy》第 4 条走手动 `uv lock`。

  # aigw 是裸 requirements.txt，没有锁文件（这个 Dependabot 解析得动）
  - package-ecosystem: "pip"
    directory: "/aigw"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(aigw)"
    groups:
      aigw_minor_patch:
        update-types: ["minor", "patch"]

  # 三处 npm 锁文件各自一条：Dependabot 要求 directory 指向含 lockfile 的目录
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(root)"
    groups:
      root_minor_patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(website)"
    groups:
      website_minor_patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/scripts/whatsapp-bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(wa)"
    groups:
      wa_minor_patch:
        update-types: ["minor", "patch"]
