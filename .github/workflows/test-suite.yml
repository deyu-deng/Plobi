# Runs the real pytest suite from a fresh environment built out of uv.lock, then
# compares the failing set against ci/known-test-failures.yml.
#
# Why this exists: arch-gates only runs the two architecture guards, so a green
# arch-gates says nothing about whether a dependency bump broke behaviour.
#
# Why it is NOT "fail if any test fails": main already carries 19 pre-existing
# failures across 7 files. A check that can never go green gets ignored, and an
# ignored gate is exactly how arch-gates stayed dead for weeks. So red here means
# specifically: a NEW failing file appeared, or the suite didn't complete.
# Baseline entries that disappear are reported as fixed, so the baseline cannot
# silently rot in the other direction either.
#
# Environment comes from `uv sync --frozen`, never a developer's .venv: local venvs
# drift away from the lock (this repo's .venv demonstrably did), and testing against a
# drifted environment verifies nothing.

name: Test suite

on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * 1"          # Mondays ~02:43 UTC, before the dependency-health run
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "ci/known-test-failures.yml"
      - "scripts/run_tests.sh"
      - "scripts/run_tests_parallel.py"
      - ".github/workflows/test-suite.yml"

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Full suite from uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install uv
        run: |
          set -euo pipefail
          pipx install uv
          uv --version

      - name: Build environment from the lockfile
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras
          uv run --no-sync python -c "import sys; print(sys.version)"

      - name: Run suite
        run: |
          nproc
          # GitHub Actions runs `bash -e` by default: with the old
          # `set -uo pipefail`, any failing test file would kill this step
          # before `echo` recorded the exit code, so Compare saw a missing
          # /tmp/suite.rc. Record the suite's own exit code first, then
          # succeed here — the Compare step below is the real gate.
          set +e
          scripts/run_tests.sh -j "$(nproc)" --file-timeout 300 2>&1 | tee /tmp/suite.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/suite.rc
          set -e
          echo "suite exit code: $rc (recorded in /tmp/suite.rc)"
          exit 0

      - name: Compare against known-failure baseline
        if: always()
        run: |
          set -euo pipefail
          uv run --quiet --with pyyaml python - <<'PY' | tee /tmp/verdict.txt
          import re, sys, yaml, pathlib, os

          log = pathlib.Path('/tmp/suite.log')
          if not log.exists():
              print('::error::找不到 /tmp/suite.log —— Run suite 步骤没有产出日志，套件未运行或日志写入失败')
              sys.exit(1)
          text = log.read_text(encoding='utf-8', errors='replace')

          rc_file = pathlib.Path('/tmp/suite.rc')
          if not rc_file.exists():
              print('::error::找不到 /tmp/suite.rc —— Run suite 步骤未记录退出码'
                    '（步骤被 bash -e 中断？）。套件未完成，不能算通过')
              sys.exit(1)
          rc = int(rc_file.read_text().strip() or '1')

          # run_tests_parallel.py prints e.g.
          #   === Summary: 123 files, 456 tests passed, 7 failed (1% complete) in 12.3s (8 workers) ===
          summary = re.search(r'===\s*Summary:\s*(\d+)\s+files?,\s*(\d+)\s+tests?\s+passed,\s*(\d+)\s+failed'
                              r'.*?\s+in\s+([\d.]+)s', text)
          failed = dict((m.group(1), int(m.group(2)))
                        for m in re.finditer(r'^\s{2}(tests/\S+\.py)\s+\((\d+)\s+tests?\s+failed\)',
                                             text, re.M))

          base = yaml.safe_load(pathlib.Path('ci/known-test-failures.yml')
                                .read_text(encoding='utf-8'))
          known = {e['path']: e for e in base.get('known_failures') or []}

          if not summary:
              print('::error::没能从输出里解析出 Summary 行 —— 套件没跑完或被中断，'
                    f'退出码 {rc}。这种情况不能当成"通过"。')
              print(f'# 测试套件：无法判定\n\n- 退出码 `{rc}`\n- 未找到 Summary 行')
              sys.exit(1)

          files, passed, failures, secs = summary.groups()
          new = sorted(set(failed) - set(known))
          fixed = sorted(set(known) - set(failed))
          same = sorted(set(failed) & set(known))

          print(f'套件：{files} 文件 / {passed} 通过 / {failures} 失败 / {float(secs)/60:.1f} 分钟')
          print(f'基线内 {len(same)} · 新增 {len(new)} · 已修好 {len(fixed)}')
          for p in new:
              print(f'::warning title=新增失败::{p}（{failed[p]} 个测试）')
          for p in fixed:
              print(f'::notice title=基线里的已消失::{p} —— 请把它从 '
                    f'ci/known-test-failures.yml 删掉，别让基线虚胖')

          out = ['# 测试套件\n',
                 f'- 文件 **{files}**，通过 **{passed}**，失败 **{failures}**，'
                 f'用时 **{float(secs)/60:.1f} 分钟**',
                 f'- 与基线一致 **{len(same)}** · **新增 {len(new)}** · 已修好 {len(fixed)}\n']
          for title, items in (('新增失败', new), ('基线内仍失败', same), ('已修好（记得清理基线）', fixed)):
              if items:
                  out.append(f'## {title}')
                  out += [f'- `{p}` ({failed.get(p, known.get(p,{}).get("tests","?"))} 个测试)'
                          f' — {known.get(p,{}).get("note","")}'.rstrip(' —')
                          for p in items]
                  out.append('')

          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(out), encoding='utf-8')

          if new:
              print(f'::error::有 {len(new)} 个新增失败文件，本次改动破坏了行为')
              sys.exit(1)
          if int(failures) != sum(failed.values()):
              print('::error::汇总的失败数与逐文件清单不一致，比对结果不可信')
              sys.exit(1)
          print('没有新增失败。')
          PY

      - name: Show verdict
        if: always()
        run: cat /tmp/verdict.txt
