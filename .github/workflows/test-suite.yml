# Runs the real pytest suite from a fresh environment built out of uv.lock, then
# compares the failing set against ci/known-test-failures.yml.
#
# Why this exists: arch-gates only runs the two architecture guards, so a green
# arch-gates says nothing about whether a dependency bump broke behaviour.
#
# Why it is NOT "fail if any test fails": main already carries 19 pre-existing
# failures across 7 files. A check that can never go green gets ignored, and an
# ignored gate is exactly how arch-gates stayed dead for weeks. So red here means
# specifically: a NEW failing file appeared, or the suite didn't complete.
# Baseline entries that disappear are reported as fixed, so the baseline cannot
# silently rot in the other direction either.
#
# Environment comes from `uv sync --frozen`, never a developer's .venv: local venvs
# drift away from the lock (this repo's .venv demonstrably did), and testing against a
# drifted environment verifies nothing.
#
# 为什么要分片（2026-11-23）：整跑一轮 24–31 分钟，而 run 45089592119 跑到第 35
# 分钟被 runner 用 SIGTERM 收走（exit 143）：「Run suite」判 failure，后面的比对
# 步骤连 `if: always()` 都没被调度 —— 整轮 CI 只剩一句「Process completed with
# exit code 143」，红得毫无信息，还得回头翻日历才知道它死在哪儿。
#
# 分片不降低「被收走」的总概率（总机时没变），降的是**代价**：整跑红一次要从头
# 再等半小时，且不知道死在哪；分片后某一片被打断时其余三片照常给出结论，重跑也
# 只需重跑那一片。加上下面那圈「137/143 只重跑一次本片」的兜底，被外部信号打断
# 就不再等于一条没有任何信息的红。
# 比对逻辑同时从内联 heredoc 挪进了 `ci/compare_known_failures.py`：分片比对有个
# 反直觉的地方（基线里的文件不在本片，不可以报成"已修好"），这种逻辑必须能脱离
# CI 用假日志测，不然改一次赌一次。

name: Test suite

on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * 1"          # Mondays ~02:43 UTC, before the dependency-health run
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "ci/known-test-failures.yml"
      - "scripts/run_tests.sh"
      - "scripts/run_tests_parallel.py"
      - "ci/compare_known_failures.py"
      - ".github/workflows/test-suite.yml"

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite slice ${{ matrix.slice }}/4
    runs-on: ubuntu-latest
    # 单片 6–8 分钟就够；45 分钟是给"这一片里恰好有个能挂很久的文件"留的余量，
    # 不是给"整跑"留的 —— 整跑那 90 分钟就是被 SIGTERM 抢先一步的那个窗口。
    timeout-minutes: 45
    strategy:
      # 一片红不许掐掉别的片：结论要么四片全有，要么一片都没有，后者正是这次要修的。
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Python
        # 钉 3.11，与装机版同一档（`release-desktop.yml` 的 `uv venv --python 3.11`）。
        #
        # 为什么不留默认：runner 镜像里默认那个 Python 会跟着镜像走（11-16 23:29 还是
        # 3.13.18 之前那一版，11-17 00:24 就换过），而 `python-olm==3.2.16`（matrix extra
        # 经 `mautrix[encryption]` 拉进来的）**没有 cp313 轮子** ⇒ uv 退回源码编译 ⇒ 它的
        # `CMakeLists.txt` 要求 CMake < 3.5，而 runner 的 CMake 已是 4.x（4.x 删掉了对
        # < 3.5 的兼容）⇒ 建环境那一步就死（"Compatibility with CMake < 3.5 has been
        # removed"），套件根本没跑。钉 3.11 之后装的是现成轮子，不碰 cmake；
        # 顺带把「验的那个 Python」变成用户真拿到的那一档。
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Release readiness gate
        # **发版这件事以前只有说明没有闸**：版本号散在七处手改、说明两份分别写、
        # 流水线没正文就回退到 GitHub 自动生成的英文清单——漂是静默的，只有装到别人
        # 机器上才看得见（v0.3.1 就漂成过一个「文案很差、没有双语」的发布页）。
        # 这一格跑在**每次 CI** 上：版本号七处一致、这一版的两份说明齐且对得上，
        # 才谈得上「这一版能发」。
        #
        # 四个分片各跑一遍是白跑三遍：这一格不依赖分片，留第一片跑就够了。
        if: matrix.slice == 1
        run: |
          set -euo pipefail
          python3 scripts/plobi/release_readiness.py

      - name: Install uv
        run: |
          set -euo pipefail
          pipx install uv
          uv --version

      - name: Build environment from the lockfile
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras
          uv run --no-sync python -c "import sys; print(sys.version)"

      - name: Plan this slice
        # 分片清单必须由**跑之前**这一刻算出来，并且与 Run suite 用同一份 args 解析：
        # 比对那一步要知道"本片本该跑哪些文件"，否则基线里的文件会被别的片误报成
        # 「已修好」。输出是单行 JSON，直接落文件给它读。
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/run_tests_parallel.py --generate-slices 4 > /tmp/slices.json
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('/tmp/slices.json').read_text(encoding='utf-8'))
          for entry in data['slice']:
              print(f"slice {entry['index']}: {len(entry['files'].split(':'))} files")
          PY

      - name: Run suite
        run: |
          nproc
          # GitHub Actions runs `bash -e` by default: with the old
          # `set -uo pipefail`, any failing test file would kill this step
          # before `echo` recorded the exit code, so Compare saw a missing
          # /tmp/suite.rc. Record the suite's own exit code first, then
          # succeed here — the Compare step below is the real gate.
          #
          # 137/143 是**被信号杀掉**（OOM killer、runner 回收），不是测试红：这种
          # 结果既不能当绿，也不该当成"改坏了"。这里只对这两种退出码重跑一次本片，
          # 真失败（1）一次都不重跑 —— 重试不许掩盖回归。两次都被杀就照实留痕，
          # 由 Compare 报"套件未完成"，而不是伪装成通过。
          set +e
          rc=1
          for attempt in 1 2; do
            scripts/run_tests.sh -j "$(nproc)" --file-timeout 300 --slice "${{ matrix.slice }}/4" 2>&1 \
              | tee "/tmp/suite.attempt${attempt}.log"
            rc=${PIPESTATUS[0]}
            cp "/tmp/suite.attempt${attempt}.log" /tmp/suite.log
            if [ "$rc" -eq 137 ] || [ "$rc" -eq 143 ]; then
              echo "::warning::第 ${attempt} 次本片被信号终止（退出码 ${rc}），重跑这一片"
              continue
            fi
            break
          done
          echo "$rc" > /tmp/suite.rc
          set -e
          echo "suite exit code: $rc (recorded in /tmp/suite.rc)"
          exit 0

      - name: Compare against known-failure baseline
        if: always()
        run: |
          set +e
          uv run --quiet --with pyyaml python ci/compare_known_failures.py \
            --log /tmp/suite.log \
            --rc-file /tmp/suite.rc \
            --baseline ci/known-test-failures.yml \
            --slice "${{ matrix.slice }}/4" \
            --slices-json /tmp/slices.json \
            --verdict-out /tmp/verdict.md
          rc=$?
          cat /tmp/verdict.md 2>/dev/null || true
          exit $rc
