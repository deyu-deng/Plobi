# Blocks regressions on ruff rules that the repo treats as hard gates.
#
# Currently the gate is PLW1514 (unspecified-encoding): the whole test suite
# enforces "UTF-8-explicit opens" and this job is what stops a Windows-only
# default-encoding bug from coming back on other platforms (CI never sees the
# Windows console codepage).  The check is deliberately `ruff check . --select
# PLW1514` rather than a full `ruff check .`: the repo still carries historical
# lint debt in product code, and making this job red on that debt would get the
# gate ignored — the failure mode that hid arch-gates for weeks (see
# action-pin-audit.yml / arch-gates.yml comments).

name: Lint

on:
  push:
    branches: [main, master, windows]
  pull_request:

permissions:
  contents: read

jobs:
  ruff-plw1514:
    name: ruff check PLW1514 (UTF-8 explicit open)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.10

      - name: Blocking ruff check
        run: |
          # PLW1514 is a preview rule in ruff 0.15.x; the CLI --select path
          # does not inherit preview from pyproject.toml, so pass --preview.
          ruff check . --select PLW1514 --preview
