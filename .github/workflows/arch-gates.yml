# ARCH-UI-MASTER §3.5 — fail the PR if Agents resurrect banned UI/API files.
# Fast: filesystem pytest + node-env vitest (no full desktop build).

name: Architecture gates

on:
  push:
    branches: [main, master, windows]
  pull_request:

permissions:
  contents: read

jobs:
  arch-gates:
    name: Frontend + backend architecture guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python test deps
        run: pip install pytest==9.0.2

      - name: Backend arch guard
        run: python -m pytest tests/plobi/test_console_arch_guard.py -q --basetemp=.pytest-run

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6  # v4.0.4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace deps
        run: npm ci

      - name: Frontend arch guard
        working-directory: apps/desktop
        run: npm run test:arch
