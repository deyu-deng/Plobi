# ARCH-UI-MASTER §3.5 — fail the PR if Agents resurrect banned UI/API files.
# Fast: filesystem pytest + node-env vitest (no full desktop build).

name: Architecture gates

on:
  push:
    branches: [main, master, windows]
  pull_request:

permissions:
  contents: read

jobs:
  arch-gates:
    name: Frontend + backend architecture guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python test deps
        run: pip install pytest==9.0.2

      - name: Backend arch guard
        run: python -m pytest tests/plobi/test_console_arch_guard.py -q --basetemp=.pytest-run

      # Windows 上跑的脚本：**带中文就必须带 UTF-8 BOM**。没有 BOM 时 Windows PowerShell 5.1
      # 按 ANSI 码页解文件（中文机器＝GBK）⇒ 中文字节被错解 ⇒ 引号与花括号对不上 ⇒
      # 解析器报「catch 语句缺少右花括号」⇒ 2026-11-17 一个中文 Windows 用户首装 0.3.2 时
      # 首启 bootstrap 直接死在语法错误上、后端起不来。
      - name: Windows script encoding gate
        run: python scripts/plobi/check_script_encoding.py

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6  # v4.0.4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace deps
        run: npm ci

      - name: Frontend arch guard
        working-directory: apps/desktop
        run: npm run test:arch
