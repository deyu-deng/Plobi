# 分平台桌面端发布流水线
# 触发：推送 v* 标签自动发版；也可手动 workflow_dispatch 跑一次（仅出包，不发 Release）
# 产物：Windows -> NSIS(.exe) + MSI；macOS -> DMG + ZIP；Linux -> AppImage + deb + rpm
# 输出目录：apps/desktop/release/
#
# 注意：
#   - 构建期不打包 Python 后端（首次启动拉取），所以无需 Python/uv 环境。
#   - 代码签名与公证均为「可选」：未配置 Secrets 时自动跳过（仅产物未签名）。
#   - macOS 如需公证，需同时配置 APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER。
#   - 多架构（mac 同时出 x64+arm64）可后续在 matrix 里扩展，本草稿先单架构。

name: Release Desktop (Windows / macOS / Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 安装整个 workspace（含 apps/desktop 及其依赖 @hermes/shared）
      - name: Install dependencies
        run: npm ci

      - name: Build & package (${{ matrix.platform }})
        working-directory: apps/desktop
        shell: bash
        env:
          # Windows Authenticode 签名（可选，留空跳过）
          CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || (matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '') }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || (matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '') }}
          # macOS 公证（可选，缺任一则 notarize.mjs 自动跳过）
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npm run dist:${{ matrix.platform }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plobi-${{ matrix.platform }}
          path: apps/desktop/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
