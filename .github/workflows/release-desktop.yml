# 分平台桌面端发布流水线
# 触发：推送 v* 标签自动发版；也可手动 workflow_dispatch 跑一次（仅出包，不发 Release）
# 产物：Windows -> NSIS(.exe) + MSI；macOS -> DMG + ZIP；Linux -> AppImage + deb + rpm
# 输出目录：apps/desktop/release/
#
# 注意：
#   - 构建期不打包 Python 后端（首次启动拉取），所以无需 Python/uv 环境。
#   - 代码签名与公证均为「可选」：未配置 Secrets 时自动跳过（仅产物未签名）。
#   - macOS 如需公证，需同时配置 APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER。
#   - 多架构（mac 同时出 x64+arm64）可后续在 matrix 里扩展，本草稿先单架构。

name: Release Desktop (Windows / macOS / Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      # 微信采集引擎是 Go 产物（bin/ 被 gitignore ⇒ 干净 checkout 里没有）。构建它的那
      # 档作业还没进仓（它的两处前提还没齐：脚本认不出 Mach-O 的 magic、Windows 镜像没有
      # mingw gcc），而 collect-backend-bundle.mjs 里有一道「采集器缺失 ⇒ 致命失败」的
      # 断言 ⇒ 不旁路就**任何发版都被拦**。旁路是带大声警告的，不是静默：包里没有采集
      # 器（与此前每一版一致），等那一档连着脚本一起落进来就把旁路撤掉、断言收回。
      PLOBI_SKIP_CHATLOG_ASSERT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      # 安装整个 workspace（含 apps/desktop 及其依赖 @plobi/shared）
      - name: Install dependencies
        run: npm ci


      # The backend travels INSIDE the installer (WP-BACKEND-IN-BUNDLE): the
      # runtime source tree plus a wheelhouse of the LOCKED dependency wheels.
      # The install then needs neither a git clone nor a PyPI resolve, and the
      # shell and the agent can no longer drift -- they come from one package.
      #
      # All three legs do it now: install.ps1 and install.sh both have the
      # -BundleDir/-Wheelhouse mode (the POSIX stage names differ -- install.sh
      # calls the dependency stage `python-deps`).
      - name: Build the backend bundle (runtime source + locked wheels)
        shell: bash
        run: |
          set -euo pipefail

          # 1) the dashboard the backend serves (plobi_cli/web_dist) -- a build
          #    artefact, not tracked in git, so it has to exist before we copy
          #    the runtime tree into the package.
          npm run build --workspace web

          # 2) the locked dependency wheels, downloaded ONCE here and installed
          #    offline on the user's machine. `--require-hashes` keeps the
          #    lockfile's SHA256 verification, and `--only-binary` forbids
          #    sdists (a sdist would have to be compiled on the user's
          #    machine -- exactly what this bundle removes).
          #
          #    `--python-version 3.11` is NOT optional: the installers pin 3.11
          #    (scripts/install.ps1::$PythonVersion, install.sh::$PYTHON_VERSION)
          #    and the venv they create is 3.11 -- downloading the wheels of
          #    the runner's own Python ships cp312 wheels the user's install
          #    cannot use (2026-11-07 measured: the shipped wheelhouse had 19
          #    cp312 wheels and one cp311).
          python -m pip install --quiet "uv==0.13.1"
          uv export --format requirements-txt --extra all --no-emit-project \
            -o apps/desktop/build/requirements.txt
          # NOT fatal: a platform whose wheels are incomplete (e.g. an arm64
          # mac with no wheel for one dependency) falls back to the PyPI
          # resolve at install time -- today's behaviour -- instead of
          # breaking the whole release build.
          python -m pip download --require-hashes --only-binary=:all: \
            --python-version 3.11 \
            -r apps/desktop/build/requirements.txt -d apps/desktop/build/wheelhouse \
            || echo "::warning::wheelhouse incomplete on this platform; the install will resolve from PyPI"

          # 3) the runtime source tree (the wheel only carries part of what the
          #    backend reads by repo-relative path -- skills/, locales/, ...).
          #    The requirements file travels with it: the offline install reads
          #    it (uv pip install -r), it is not a lockfile (uv sync would go
          #    to the recorded URLs instead of the local wheelhouse).
          node apps/desktop/scripts/collect-backend-bundle.mjs

      # The install on the user's machine is OFFLINE (--no-index --find-links).
      # Prove it here, on the same wheels, before shipping a package whose first
      # launch quietly falls back to PyPI (2026-11-07: it did, twice, for two
      # different reasons).
      - name: Verify the offline install (the bundled wheelhouse must satisfy the lock)
        shell: bash
        run: |
          set -euo pipefail

          uv python install 3.11
          VENV="$RUNNER_TEMP/venv-offline-verify"
          uv venv --python 3.11 "$VENV"
          PY="$VENV/bin/python"
          [ -x "$PY" ] || PY="$VENV/Scripts/python.exe"

          uv pip install --no-index --find-links apps/desktop/build/wheelhouse \
            --require-hashes --python "$PY" \
            -r apps/desktop/build/requirements.txt

          # 装机版跑的是 `python -m plobi_cli.main`，源码树在 PYTHONPATH 上（项目本体
          # 不进 venv）⇒ 探针也得带上那一格，否则 import 必然失败。
          PYTHONPATH="$PWD/apps/desktop/build/backend" \
            "$PY" -c "import plobi_cli, dotenv, openai, rich, prompt_toolkit, sys; print('offline install OK:', sys.version.split()[0])"

      # The toolchain travels in the package too (Windows only): PortableGit
      # (git + bash) and ripgrep.  Without it the FIRST LAUNCH had to download
      # them -- which is why our install felt nothing like everyone else's.
      # macOS and Linux ship git and bash in the base system; the script says so
      # and writes nothing.
      - name: Collect the toolchain (PortableGit + ripgrep)
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/collect-toolchain-bundle.mjs

      - name: Build & package (${{ matrix.platform }})
        working-directory: apps/desktop
        shell: bash
        env:
          # 签名证书经中转 env 传入，非空才 export 成 CSC_LINK / CSC_KEY_PASSWORD。
          # 不能直接 `CSC_LINK: ${{ secrets.X || '' }}`：secret 缺位时 env 仍是空串，
          # 而 app-builder-lib 的 mac 路径只判 cscLink == null（windowsSignToolManager
          # 才显式判 === ""），空串会被当成证书路径 → importCertificate('') →
          # resolveCscLinkPath('', projectDir) = projectDir → 存在但是目录 →
          # "<projectDir> not a file"，mac 打包当场炸（run 39251532275 实测）。
          # win 因显式判空串不受害，但两边同一套写法，不留雷。
          PLOBI_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          PLOBI_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          PLOBI_MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          PLOBI_MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # macOS 公证（可选，缺任一则 notarize.mjs 自动跳过）
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            if [ -n "${PLOBI_WIN_CSC_LINK:-}" ]; then export CSC_LINK="$PLOBI_WIN_CSC_LINK"; fi
            if [ -n "${PLOBI_WIN_CSC_KEY_PASSWORD:-}" ]; then export CSC_KEY_PASSWORD="$PLOBI_WIN_CSC_KEY_PASSWORD"; fi
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            if [ -n "${PLOBI_MAC_CSC_LINK:-}" ]; then export CSC_LINK="$PLOBI_MAC_CSC_LINK"; fi
            if [ -n "${PLOBI_MAC_CSC_KEY_PASSWORD:-}" ]; then export CSC_KEY_PASSWORD="$PLOBI_MAC_CSC_KEY_PASSWORD"; fi
          fi
          npm run dist:${{ matrix.platform }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: plobi-${{ matrix.platform }}
          path: apps/desktop/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --generate-notes 要在本地跑 git 找上一个 tag；本 job 原先没有 checkout，
      # gh 在 "failed to run git: not a git repository" 当场死（run 39254593039
      # 三平台全绿后栽在这）。拉全量历史（含 tags）给它。
      # 必须排在 download 之前：checkout 会 clean 工作区，后 download 会被它删掉
      # （run 39256399339 实测 artifacts/ 被清空 → "拒绝创建空 release"）。
      - name: Checkout (release notes need git)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # 原先用 softprops/action-gh-release（第三方个人仓库）完成这一步，而它恰好跑在
      # 带 contents: write 的任务上。改用 runner 自带的 gh（官方镜像清单里的
      # "GitHub CLI 2.101.0"），把「陌生人的代码 + 写权限」这个组合从发布路径上拿掉。
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 只挂文件：release/* 里的 linux-unpacked / mac-arm64 / win-unpacked
          # 是目录，GitHub release asset 不接受目录
          assets=()
          for f in artifacts/*; do
            [ -f "$f" ] && assets+=("$f")
          done

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::artifacts/ 里没有文件，拒绝创建空 release"
            exit 1
          fi

          printf '挂到 release 的文件 (%d 个):\n' "${#assets[@]}"
          printf '  %s\n' "${assets[@]}"

          # 不加 --verify-tag：checkout 拉的就是这个 tag 本身，它必然已存在。
          gh release create "$TAG" --generate-notes --title "$TAG" "${assets[@]}"
