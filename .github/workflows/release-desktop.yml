# 分平台桌面端发布流水线
# 触发：推送 v* 标签自动发版；也可手动 workflow_dispatch 跑一次（仅出包，不发 Release）
# 产物：Windows -> NSIS(.exe) + MSI；macOS -> DMG + ZIP；Linux -> AppImage + deb + rpm
# 输出目录：apps/desktop/release/
#
# 注意：
#   - 构建期不打包 Python 后端（首次启动拉取），所以无需 Python/uv 环境。
#   - 代码签名与公证均为「可选」：未配置 Secrets 时自动跳过（仅产物未签名）。
#   - macOS 如需公证，需同时配置 APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER。
#   - 多架构（mac 同时出 x64+arm64）可后续在 matrix 里扩展，本草稿先单架构。

name: Release Desktop (Windows / macOS / Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The WeChat collector engine (vendored chatlog, a Go program) is NOT in the
  # repo: vendor/chatlog/.gitignore ignores bin/, so a CI checkout has no binary
  # at all. It used to be assumed present -- and it never was on a runner, so
  # every released installer shipped without it and the collector was dead on
  # arrival for the user. Compile it here, once per OS, and hand the binaries to
  # the packaging job; the packaging job's hard gate then fails if this step was
  # skipped or the artefact didn't land.
  chatlog:
    name: Build chatlog (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: chatlog-windows
            binary: chatlog.exe
          - os: macos-latest
            platform: macos
            artifact: chatlog-macos
            binary: chatlog
          - os: ubuntu-latest
            platform: linux
            artifact: chatlog-linux
            binary: chatlog
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00  # v6.0.0
        with:
          # vendor/chatlog/go.mod says `go 1.24.0`.
          go-version: "1.24.x"

      # CGO needs a C compiler.  The windows image does NOT ship mingw-w64
      # (MSYS2's base packages have no gcc), so install it there; macOS/Linux
      # runners already have one.  The build script finds the compiler on its
      # own (its candidate table has C:\msys64\mingw64\bin\gcc.exe), so nothing
      # here points at a path.
      - name: Install the CGO compiler (mingw-w64 gcc)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      # The binary is CGO (WCDB links a C library), so no CGO_ENABLED=0 shortcut.
      # Build script: plobi/collectors/chatlog/vendor/chatlog -> bin/chatlog[.exe]
      - name: Build the collector engine
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/build-chatlog.mjs --force

      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          bin="plobi/collectors/chatlog/vendor/chatlog/bin/${{ matrix.binary }}"
          ls -l "$bin"
          "./$bin" version

      - name: Upload the collector engine
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: plobi/collectors/chatlog/vendor/chatlog/bin/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7


  build:
    name: Build ${{ matrix.platform }}
    needs: chatlog
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            chatlog_artifact: chatlog-windows
            chatlog_binary: chatlog.exe
          - os: macos-latest
            platform: mac
            chatlog_artifact: chatlog-macos
            chatlog_binary: chatlog
          - os: ubuntu-latest
            platform: linux
            chatlog_artifact: chatlog-linux
            chatlog_binary: chatlog
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      # 安装整个 workspace（含 apps/desktop 及其依赖 @plobi/shared）
      - name: Install dependencies
        run: npm ci

      # Must land BEFORE collect-backend-bundle.mjs below: that script copies the
      # source tree into build/backend and then asserts the binary is in the
      # copy. Copies of a checkout never contain it (bin/ is gitignored), which
      # is exactly the bug this workflow now prevents.
      - name: Download the collector engine
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ matrix.chatlog_artifact }}
          path: apps/desktop/build/chatlog-bin

      - name: Install the collector engine into the runtime tree
        shell: bash
        run: |
          set -euo pipefail
          src="apps/desktop/build/chatlog-bin/${{ matrix.chatlog_binary }}"
          dest="plobi/collectors/chatlog/vendor/chatlog/bin"
          if [ ! -f "$src" ]; then
            echo "::error::collector engine artefact missing at $src"
            exit 1
          fi
          mkdir -p "$dest"
          cp -f "$src" "$dest/${{ matrix.chatlog_binary }}"
          chmod +x "$dest/${{ matrix.chatlog_binary }}" || true
          ls -l "$dest/${{ matrix.chatlog_binary }}"

      # The collector engine is a Go binary: CI downloads it into the runtime
      # tree, so the checkout has an untracked file by design.  The vendored
      # .gitignore only covers `*.exe`, which is why Windows looked clean
      # (chatlog.exe) while mac/linux did not (chatlog, no extension) — and
      # the packaging guard ("a package must point at a commit") then refused
      # to package.  Say it is build output, locally: a CI-only ignore rule,
      # not a committed one (the vendored tree is not ours to edit).
      - name: Mark the downloaded collector engine as build output
        shell: bash
        run: |
          mkdir -p .git/info
          echo "plobi/collectors/chatlog/vendor/chatlog/bin/" >> .git/info/exclude
          git status --porcelain



      # The backend travels INSIDE the installer (WP-BACKEND-IN-BUNDLE): the
      # runtime source tree plus a wheelhouse of the LOCKED dependency wheels.
      # The install then needs neither a git clone nor a PyPI resolve, and the
      # shell and the agent can no longer drift -- they come from one package.
      #
      # All three legs do it now: install.ps1 and install.sh both have the
      # -BundleDir/-Wheelhouse mode (the POSIX stage names differ -- install.sh
      # calls the dependency stage `python-deps`).
      - name: Build the backend bundle (runtime source + locked wheels)
        shell: bash
        run: |
          set -euo pipefail

          # 1) the dashboard the backend serves (plobi_cli/web_dist) -- a build
          #    artefact, not tracked in git, so it has to exist before we copy
          #    the runtime tree into the package.
          npm run build --workspace web

          # 2) the locked dependency wheels, downloaded ONCE here and installed
          #    offline on the user's machine. `--require-hashes` keeps the
          #    lockfile's SHA256 verification, and `--only-binary` forbids
          #    sdists (a sdist would have to be compiled on the user's
          #    machine -- exactly what this bundle removes).
          #
          #    `--python-version 3.11` is NOT optional: the installers pin 3.11
          #    (scripts/install.ps1::$PythonVersion, install.sh::$PYTHON_VERSION)
          #    and the venv they create is 3.11 -- downloading the wheels of
          #    the runner's own Python ships cp312 wheels the user's install
          #    cannot use (2026-11-07 measured: the shipped wheelhouse had 19
          #    cp312 wheels and one cp311).
          python -m pip install --quiet "uv==0.13.1"
          uv export --format requirements-txt --extra all --no-emit-project \
            -o apps/desktop/build/requirements.txt
          # NOT fatal: a platform whose wheels are incomplete (e.g. an arm64
          # mac with no wheel for one dependency) falls back to the PyPI
          # resolve at install time -- today's behaviour -- instead of
          # breaking the whole release build.
          python -m pip download --require-hashes --only-binary=:all: \
            --python-version 3.11 \
            -r apps/desktop/build/requirements.txt -d apps/desktop/build/wheelhouse \
            || echo "::warning::wheelhouse incomplete on this platform; the install will resolve from PyPI"

          # 3) the runtime source tree (the wheel only carries part of what the
          #    backend reads by repo-relative path -- skills/, locales/, ...).
          #    The requirements file travels with it: the offline install reads
          #    it (uv pip install -r), it is not a lockfile (uv sync would go
          #    to the recorded URLs instead of the local wheelhouse).
          node apps/desktop/scripts/collect-backend-bundle.mjs

      # The install on the user's machine is OFFLINE (--no-index --find-links).
      # Prove it here, on the same wheels, before shipping a package whose first
      # launch quietly falls back to PyPI (2026-11-07: it did, twice, for two
      # different reasons).
      - name: Verify the offline install (the bundled wheelhouse must satisfy the lock)
        shell: bash
        run: |
          set -euo pipefail

          uv python install 3.11
          VENV="$RUNNER_TEMP/venv-offline-verify"
          uv venv --python 3.11 "$VENV"
          PY="$VENV/bin/python"
          [ -x "$PY" ] || PY="$VENV/Scripts/python.exe"

          uv pip install --no-index --find-links apps/desktop/build/wheelhouse \
            --require-hashes --python "$PY" \
            -r apps/desktop/build/requirements.txt

          # 装机版跑的是 `python -m plobi_cli.main`，源码树在 PYTHONPATH 上（项目本体
          # 不进 venv）⇒ 探针也得带上那一格，否则 import 必然失败。
          PYTHONPATH="$PWD/apps/desktop/build/backend" \
            "$PY" -c "import plobi_cli, dotenv, openai, rich, prompt_toolkit, sys; print('offline install OK:', sys.version.split()[0])"

      # The toolchain travels in the package too (Windows only): PortableGit
      # (git + bash) and ripgrep.  Without it the FIRST LAUNCH had to download
      # them -- which is why our install felt nothing like everyone else's.
      # macOS and Linux ship git and bash in the base system; the script says so
      # and writes nothing.
      - name: Collect the toolchain (PortableGit + ripgrep)
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/collect-toolchain-bundle.mjs

      # The first launch must not download anything: the runtime, the package
      # manager, the interpreter and the tools all travel inside the package.
      # A missing piece is not "the installer will fetch it later" — it is the
      # exact first-launch stall this bundle exists to remove, so the release
      # fails here instead of on the user's machine.
      - name: Verify the bundled toolchain (nothing may be missing)
        shell: bash
        run: |
          set -euo pipefail
          tc=apps/desktop/build/toolchain
          missing=""
          for want in node ffmpeg uv cpython; do
            ls "$tc" | grep -q "^$want" || missing="$missing $want"
          done
          if [ "${{ matrix.platform }}" = "win" ]; then
            ls "$tc" | grep -q "^PortableGit" || missing="$missing PortableGit"
            ls "$tc" | grep -q "^ripgrep" || missing="$missing ripgrep"
          fi
          if [ -n "$missing" ]; then
            echo "::error::the bundled toolchain is missing:$missing"
            ls -la "$tc" || true
            exit 1
          fi
          ls -la "$tc"

      - name: Build & package (${{ matrix.platform }})
        working-directory: apps/desktop
        shell: bash
        env:
          # 签名证书经中转 env 传入，非空才 export 成 CSC_LINK / CSC_KEY_PASSWORD。
          # 不能直接 `CSC_LINK: ${{ secrets.X || '' }}`：secret 缺位时 env 仍是空串，
          # 而 app-builder-lib 的 mac 路径只判 cscLink == null（windowsSignToolManager
          # 才显式判 === ""），空串会被当成证书路径 → importCertificate('') →
          # resolveCscLinkPath('', projectDir) = projectDir → 存在但是目录 →
          # "<projectDir> not a file"，mac 打包当场炸（run 39251532275 实测）。
          # win 因显式判空串不受害，但两边同一套写法，不留雷。
          PLOBI_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          PLOBI_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          PLOBI_MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          PLOBI_MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # macOS 公证（可选，缺任一则 notarize.mjs 自动跳过）
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            if [ -n "${PLOBI_WIN_CSC_LINK:-}" ]; then export CSC_LINK="$PLOBI_WIN_CSC_LINK"; fi
            if [ -n "${PLOBI_WIN_CSC_KEY_PASSWORD:-}" ]; then export CSC_KEY_PASSWORD="$PLOBI_WIN_CSC_KEY_PASSWORD"; fi
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            if [ -n "${PLOBI_MAC_CSC_LINK:-}" ]; then export CSC_LINK="$PLOBI_MAC_CSC_LINK"; fi
            if [ -n "${PLOBI_MAC_CSC_KEY_PASSWORD:-}" ]; then export CSC_KEY_PASSWORD="$PLOBI_MAC_CSC_KEY_PASSWORD"; fi
          fi
          npm run dist:${{ matrix.platform }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: plobi-${{ matrix.platform }}
          path: apps/desktop/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --generate-notes 要在本地跑 git 找上一个 tag；本 job 原先没有 checkout，
      # gh 在 "failed to run git: not a git repository" 当场死（run 39254593039
      # 三平台全绿后栽在这）。拉全量历史（含 tags）给它。
      # 必须排在 download 之前：checkout 会 clean 工作区，后 download 会被它删掉
      # （run 39256399339 实测 artifacts/ 被清空 → "拒绝创建空 release"）。
      - name: Checkout (release notes need git)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # 原先用 softprops/action-gh-release（第三方个人仓库）完成这一步，而它恰好跑在
      # 带 contents: write 的任务上。改用 runner 自带的 gh（官方镜像清单里的
      # "GitHub CLI 2.101.0"），把「陌生人的代码 + 写权限」这个组合从发布路径上拿掉。
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 只挂文件：release/* 里的 linux-unpacked / mac-arm64 / win-unpacked
          # 是目录，GitHub release asset 不接受目录
          assets=()
          for f in artifacts/*; do
            [ -f "$f" ] && assets+=("$f")
          done

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::artifacts/ 里没有文件，拒绝创建空 release"
            exit 1
          fi

          printf '挂到 release 的文件 (%d 个):\n' "${#assets[@]}"
          printf '  %s\n' "${assets[@]}"

          # 不加 --verify-tag：checkout 拉的就是这个 tag 本身，它必然已存在。
          gh release create "$TAG" --generate-notes --title "$TAG" "${assets[@]}"
