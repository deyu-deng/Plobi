# 分平台桌面端发布流水线
# 触发：推送 v* 标签自动发版；也可手动 workflow_dispatch 跑一次（仅出包，不发 Release）
# 产物：Windows -> NSIS(.exe) + MSI；macOS -> DMG + ZIP；Linux -> AppImage + deb + rpm
# 输出目录：apps/desktop/release/
#
# 注意：
#   - 构建期不打包 Python 后端（首次启动拉取），所以无需 Python/uv 环境。
#   - 代码签名与公证均为「可选」：未配置 Secrets 时自动跳过（仅产物未签名）。
#   - macOS 如需公证，需同时配置 APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER。
#   - 多架构（mac 同时出 x64+arm64）可后续在 matrix 里扩展，本草稿先单架构。

name: Release Desktop (Windows / macOS / Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      # 安装整个 workspace（含 apps/desktop 及其依赖 @plobi/shared）
      - name: Install dependencies
        run: npm ci

      - name: Build & package (${{ matrix.platform }})
        working-directory: apps/desktop
        shell: bash
        env:
          # Windows Authenticode 签名（可选，留空跳过）
          CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || (matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '') }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || (matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '') }}
          # macOS 公证（可选，缺任一则 notarize.mjs 自动跳过）
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npm run dist:${{ matrix.platform }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: plobi-${{ matrix.platform }}
          path: apps/desktop/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      # 原先用 softprops/action-gh-release（第三方个人仓库）完成这一步，而它恰好跑在
      # 带 contents: write 的任务上。改用 runner 自带的 gh（官方镜像清单里的
      # "GitHub CLI 2.101.0"），把「陌生人的代码 + 写权限」这个组合从发布路径上拿掉。
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(artifacts/*)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::artifacts/ 为空，build 任务没有产出任何文件，拒绝创建空 release"
            exit 1
          fi

          printf '挂到 release 的文件 (%d 个):\n' "${#assets[@]}"
          printf '  %s\n' "${assets[@]}"

          # 不加 --verify-tag：本 job 没有 checkout、没有本地 git，而它只在
          # refs/tags/v* 上被触发，标签必然已存在。
          gh release create "$TAG" --generate-notes --title "$TAG" "${assets[@]}"
