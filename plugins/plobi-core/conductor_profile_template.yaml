# WP-L1-BUDGET — L1 总秘书（default profile）运行时预算模板
#
# 这是仓库内唯一的 "L1 默认 profile 模板"：被
# ``plugins/plobi-core/conductor_budget.py`` 引用，也是
# ``tests/plobi/test_conductor_budget.py::test_compression_threshold_in_default_profile_template``
# 的解析对象。
#
# 不要把 PLOBI_HOME 下的运行时 config.yaml 当作交付物（任务书禁令）。
# 也不要改 ``agent/context_compressor.py`` 的默认 ``threshold_percent=0.50``——
# L1 的覆盖只对 default profile + plobi_core 工具集启用时生效，
# 其它 profile / 工具集仍走 0.50 默认值。
#
# 模型窗口与触发换算（参考）：
#   200K ctx × 0.35 = ~70K token 触发压缩（任务书目标：6–8 万 token 前切开）
#   128K ctx × 0.35 = ~44K 触发
#   64K  ctx × 0.35 → 触发 floored 到 MINIMUM_CONTEXT_LENGTH（32K）或 85% 窗口

# 压缩阈值与开场保护——L1 总秘书专属。
#
# 这条路径（``compression.*``）才是有人读的：``agent/agent_init.py:1505`` 取 threshold、
# ``:1555`` / ``:1563`` 取 protect_last_n / protect_first_n，再传进 ContextCompressor
# （``agent_init.py:1819-1820``）。这段以前写在 ``context.compressor.*`` 下——那是没人读的
# 路径（``config.context`` 只认 ``engine``，见 ``plobi_cli/config.py:2181``），所以
# ``protect_first_n: 1`` 这条承诺从来没发生过（实际一直用默认 3）。10-12 接回真路径。
compression:
  # 0.50 → 0.35。声明值可以比这里更紧、不能更松：
  # ``conductor_budget._tighten_compressor`` 取 min(配置值, CONDUCTOR_COMPRESSION_THRESHOLD)，
  # 并且绕开小窗口的 0.75 floor（任务书要的就是 6–8 万 token 前切开）。
  threshold: 0.35
  # 头部只保留系统提示 + 第一条用户消息；长会话滚动压缩时不要把开场三轮钉死。
  # 不写 protect_last_n：它等于代码默认 20，写进来只是多盖一层用户自己的调参。
  protect_first_n: 1

# 回合后 curator——L1 只关 **skill** 那一半。
# ``conductor_budget._disable_curators`` 把 ``agent._skill_nudge_interval`` 置 0，
# 对应 ``agent/turn_finalizer.py:480-485`` 的 ``_should_review_skill``：不再 fork
# 「Review the conversation above and update the skill library」。
#
# ⚠️ **记忆提醒不关**（2026-11-19 改正）：同一函数原先把 ``_memory_nudge_interval``
# 也归零，于是指挥——桌面主会话——永远收不到「把这一轮学到的东西收进记忆」那一句，
# 310 条会话里 memory 工具真调用 0 次。记忆不更新不是模型懒，是提醒被关掉了。
# 现在这一格跟 ``memory.nudge_interval`` 走（出厂 10 轮）。
memory:
  memory_enabled: true        # L0 内置 memory 总开关开（裁 156；上限走出厂 2200/1375）
  user_profile_enabled: true  # 画像注入同步开（画像仍一份）
  nudge_interval: 10          # 每 10 个用户回合提醒一次写记忆（0 才是关）

skills:
  creation_nudge_interval: 0  # 关 L1 回合后的 skill curator fork
