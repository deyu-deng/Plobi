# Plobi L1 (secretary) knobs — merge into the **active/default** profile
# Copy relevant keys into $PLOBI_HOME/config.yaml (usually the default profile).
# Do NOT run `plobi profile create master` (ARCH-RULINGS 2026-09-04 裁定 6).
# L1 is the current activity profile; open toolset plobi_core there.
# Register as the resident L1 via: plobi plobi agents register secretary
#   --role conductor --profile default --provider moonshot --model kimi-k3
#   (or copy docs/plobi/profiles/projects.yaml to $PLOBI_HOME/plobi/projects.yaml)
# Intent: best available model, narrow tool surface, clean orchestrator context.
# Contract: Docs/SPEC-FINAL.md; routing rationale: ADR-0011.

# L1 = best available model. **Contract does not pin a model name** (2026-08-29
# revision; 裁定 47 removed "L1 and L2 must differ"): the default follows code
# config and is switchable per agent in the UI Pill. Cost discipline is the
# real constraint — L1 stays OUT of tool loops and per-message classification.
model: ""  # e.g. a flagship chat-completions model — set when a key is available

# L2 (project / specialist agents) run cheap models or bezel-aggregated quota.
# Keep L1 and L2 on SEPARATE sessions — never switch models mid reasoning chain.
delegation:
  orchestrator_enabled: true
  max_spawn_depth: 2
  max_concurrent_children: 4
  # Point delegation at the cheap L2 model; L1 only receives summaries.
  provider: ""   # e.g. deepseek
  model: ""      # e.g. deepseek-chat

# L1 must NOT burn free-tier GUI quotas itself. Closed-source AI software that
# cannot be exposed as an API belongs to the offload (L3) column: it is a full
# agent with its own tools/session (ruling 205), not a model provider here.
# Pico HID / computer_use are just input channels into that software.

# Memory brain: Mind holds knowledge + profile (set MIND_ROOT; the surface lives
# outside this repo). Runtime state (agenda / DDL) lives in SQLite, not Mind
# (ADR-0007). Mind writes go through the non-LLM serial writer service.
memory:
  memory_enabled: true
  # 两件正交的事（WP-MIND-COEXIST）：`mind_enabled` 管官方记忆脑在不在（缺键＝开），
  # `provider` 只指**外部**服务（缺键／空串＝不接；老配置写 `mind` 也读成不接）。
  # 解析在 agent/memory_manager.py::resolve_mind_enabled / resolve_external_provider_name。
  # 真磁盘 I/O 在 plobi/mind/writer.py（串行锁 + 白名单前缀 + 提交前脑侧 verifier）。
  # 官方记忆脑是内核模块 plobi/mind/，不是 plugins/memory/ 下的插件。

# Narrow toolsets for L1 sessions — WP-BE-9 mid-narrow (裁定 12).
# Drop terminal / session_search / code runners; keep clarify. Reversible:
# re-add those names under platform_toolsets. Applied by
# plobi.agents.registry.ensure_north_star_toolset on the active profile.
platform_toolsets:
  cli:
    - web
    - file
    - memory
    - skills
    - todo
    - clarify
    - delegation
    - plobi_core
  gateway:
    - web
    - file
    - memory
    - skills
    - todo
    - clarify
    - delegation
    - plobi_core

plugins:
  # Standalone plugins are opt-in — this profile must enable plobi-core.
  enabled:
    - plobi-core
  entries:
    plobi-core:
      enabled: true

# Approvals: human closes high-risk; night mode respects the risk queue.
approvals:
  mode: manual

display:
  # L1 UI should emphasize status / approvals / preview, not raw tool spam.
  tool_progress: verbose
