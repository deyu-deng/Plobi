# Plobi L2 resident agent registry template (B2)
# Copy to $PLOBI_HOME/plobi/projects.yaml and edit.
# Wire-up: `plobi plobi agents list` / `plobi plobi agents spawn <name>`
# Contract: docs/plobi/north_star/ARCHITECTURE.md（L2 = 每项目一个常驻 agent）;
# routing rationale: ADR-0011（L1≠L2 模型）。

version: 1
agents:
  # L1 用当前活动 profile（多为 default）。不要 plobi profile create master。
  # 把 plobi_north_star 打开在该 profile 的 toolsets / platform_toolsets 即可。
  secretary:
    role: l1_secretary
    profile: default
    provider: moonshot        # e.g. moonshot/kimi-k3
    model: kimi-k3
    mind_subtree: Vault/projects/Plobi
    skills: [plobi-morning-report, plobi-message-digest]
    description: L1 日程秘书 — 统筹、决策、派工、收摘要

  # 示例 L2：日程秘书。L1 的 plobi_secretary_ask 在名单里没有日程角色时
  # 只会按此模板 spawn **一个**（S2），不会任意新建其它 L2。
  agenda:
    role: l2_agenda
    profile: l2-agenda
    provider: aigw
    model: workbuddy/deepseek-chat
    mind_subtree: Vault/projects/Plobi
    skills: [plobi-l2-resident]
    description: 日程采集 → SQLite → 看板 → 钉钉 闭环
