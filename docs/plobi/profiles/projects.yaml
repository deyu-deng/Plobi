# Plobi L2 resident agent registry template (B2)
# Copy to $PLOBI_HOME/plobi/projects.yaml and edit.
# Wire-up: `plobi plobi agents list` / `plobi plobi agents spawn <name>`
# 域声明真源：plobi/agents/domains.py（裁定 218）。每一行的 `category` 本身
# 就是一个域；`domains` 是可选的细标签，同一类目里几行分摊不同事务时才写。
# 程序在 say/ask 派发前拿这张表核对 `to`，不从话里猜、不替发起方挑人。
# routing rationale: ADR-0011（L1≠L2 模型）。

version: 1
agents:
  # L1 是派工的一方，不声明域。工具集在共享层全局配置里打开即可。
  secretary:
    role: l1_secretary
    provider: moonshot        # e.g. moonshot/kimi-k3
    model: kimi-k3
    mind_subtree: Dossiers/projects/Plobi
    skills: [plobi-morning-report, plobi-message-digest]
    description: L1 日程秘书 — 统筹、决策、派工、收摘要

  # 示例 L2：一个专管日程的角色。**这不是出厂件**——产品不替用户建任何 L2
  # （裁定 211：首装只有 L1、零 L2、零预置定时任务）；这一行是给你抄过去改的示例。
  # 要一个专管日程的角色，自己加一条，或让 L1 按你的事建一个。
  # `domains` 这行是域声明的例子：声明了 schedule 之后，派工时填 domain=schedule
  # 就必须落在这一行；不填则完全照旧按名字发。
  agenda:
    role: l2_agenda
    provider: aigw
    model: workbuddy/deepseek-chat
    mind_subtree: Dossiers/projects/Plobi
    skills: [plobi-l2-resident]
    domains: [schedule, agenda]
    description: 日程采集 → SQLite → 看板 → 钉钉 闭环
