# 名册 name → 运行时 slug（= 子进程 plobi -p 的门牌号）
# 规则：ASCII 名缺省 = name.lower()；非 ASCII 或需要固定历史的，必须在此显式登记。
#
# 2026-11-05「profile 连根拔 · 后端批」：profile 不再是名册上可填写的一格，
# 而是由 name 机械派生的内部 slug（见 AgentEntry.profile_name / derive_runtime_slug）。
#
# 这张表只为一件事存在：下面这 14 行的 slug 必须跟改造前一字不差。它们的 slug
# 已经散落在 souls/<slug>.md、memory/agents/<slug>/ 与会话归属里，换个名字就等于
# 让这些 Agent 的身份文件与记忆当场读空。
#
# 新行不要往这里加——机械派生就够了。真需要固定 slug 时，用户侧写
# $PLOBI_HOME/plobi/runtime-slugs.yaml（同名键优先，格式相同）。
